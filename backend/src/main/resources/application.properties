spring.application.name=app
server.port=8080
chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,https://real-time-chat-application-frontend-zxli.onrender.com}
chat.upload-dir=${CHAT_UPLOAD_DIR:uploads}
chat.upload-max-total-bytes=${CHAT_UPLOAD_MAX_TOTAL_BYTES:1073741824}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
server.error.include-message=never
server.error.include-stacktrace=never
